services:
  - type: web
    name: shadowblog
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shadowblog-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: shadowblog-db
    databaseName: shadowblog
    region: singapore
    plan: free
